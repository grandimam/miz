[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suki"
version = "0.1.0"
description = "Build expertise. Validate it. Own it. A stack of AI-agent skills for learning and career."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gaurav Mukherjee" }]
keywords = ["learning", "career", "interview-prep", "skills", "ai-agents", "spaced-repetition"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/grandimam/suki"
Repository = "https://github.com/grandimam/suki"

[project.scripts]
suki = "suki.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/suki"]

[tool.hatch.build.targets.wheel.force-include]
home = "suki/skills/home"
career = "suki/skills/career"
curriculum = "suki/skills/curriculum"
learn = "suki/skills/learn"
probe = "suki/skills/probe"
book = "suki/skills/book"
resume = "suki/skills/resume"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "home",
  "career",
  "curriculum",
  "learn",
  "probe",
  "book",
  "resume",
  "test",
]